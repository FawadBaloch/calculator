<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-in-1 Calculator & Currency</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .app-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 350px;
        }
        /* Tabs Styling */
        .tabs {
            display: flex;
            background: #0f172a;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 18px;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 9px 4px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #2563eb;
            color: #ffffff;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        /* Simple Calculator Styling */
        #display {
            width: 100%;
            height: 55px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 15px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 0 12px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .calc-btn {
            padding: 16px 0;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background: #334155;
            color: white;
            border: none;
            border-radius: 10px;
        }
        .calc-btn:active {
            background: #475569;
        }
        .op {
            background: #1d4ed8;
        }
        .clear {
            background: #dc2626;
        }
        .equal {
            background: #16a34a;
            grid-column: span 2;
        }
        /* Form & Inputs Styling */
        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 5px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #334155;
            border-radius: 8px;
        }
        .row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .action-btn {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .action-btn:active {
            background: #1d4ed8;
        }
        .swap-btn {
            background: #334155;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 18px;
        }
        .result-box {
            margin-top: 15px;
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #334155;
        }
        .res-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .res-item:last-child {
            margin-bottom: 0;
            padding-top: 8px;
            border-top: 1px solid #334155;
            font-weight: bold;
            color: #38bdf8;
        }
        .currency-big {
            font-size: 20px;
            font-weight: bold;
            color: #4ade80;
            text-align: center;
            margin: 5px 0;
        }
        .rate-status {
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="app-box">
    <!-- Top 3 Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('simple', this)">Simple</button>
        <button class="tab-btn" onclick="switchTab('loan', this)">Loan</button>
        <button class="tab-btn" onclick="switchTab('currency', this)">Currency</button>
    </div>

    <!-- 1. Simple Calculator -->
    <div id="simple" class="section active">
        <input type="text" id="display" readonly placeholder="0">
        <div class="buttons">
            <button class="calc-btn clear" onclick="clearDisplay()">C</button>
            <button class="calc-btn" onclick="deleteLast()">⌫</button>
            <button class="calc-btn op" onclick="appendValue('%')">%</button>
            <button class="calc-btn op" onclick="appendValue('/')">÷</button>

            <button class="calc-btn" onclick="appendValue('7')">7</button>
            <button class="calc-btn" onclick="appendValue('8')">8</button>
            <button class="calc-btn" onclick="appendValue('9')">9</button>
            <button class="calc-btn op" onclick="appendValue('*')">×</button>

            <button class="calc-btn" onclick="appendValue('4')">4</button>
            <button class="calc-btn" onclick="appendValue('5')">5</button>
            <button class="calc-btn" onclick="appendValue('6')">6</button>
            <button class="calc-btn op" onclick="appendValue('-')">−</button>

            <button class="calc-btn" onclick="appendValue('1')">1</button>
            <button class="calc-btn" onclick="appendValue('2')">2</button>
            <button class="calc-btn" onclick="appendValue('3')">3</button>
            <button class="calc-btn op" onclick="appendValue('+')">+</button>

            <button class="calc-btn" onclick="appendValue('0')">0</button>
            <button class="calc-btn" onclick="appendValue('.')">.</button>
            <button class="calc-btn equal" onclick="calculate()">=</button>
        </div>
    </div>

    <!-- 2. Loan Calculator -->
    <div id="loan" class="section">
        <div class="input-group">
            <label>Loan Ki Raqam (Amount)</label>
            <input type="number" id="loanAmount" placeholder="Maslan: 100000">
        </div>
        <div class="input-group">
            <label>Salana Markup / Interest (%)</label>
            <input type="number" id="interestRate" placeholder="Maslan: 12" step="0.1">
        </div>
        <div class="input-group">
            <label>Muddat (Duration)</label>
            <div class="row">
                <input type="number" id="loanTerm" placeholder="Maslan: 12">
                <select id="termType">
                    <option value="months">Mahine</option>
                    <option value="years">Saal</option>
                </select>
            </div>
        </div>
        <button class="action-btn" onclick="calculateLoan()">Hisaab Lagayein</button>

        <div class="result-box" id="loanResult" style="display:none;">
            <div class="res-item">
                <span>Mahana Qist (EMI):</span>
                <strong id="emiVal">0</strong>
            </div>
            <div class="res-item">
                <span>Total Markup:</span>
                <strong id="totalInterest">0</strong>
            </div>
            <div class="res-item">
                <span>Total Wapsi:</span>
                <strong id="totalPayment">0</strong>
            </div>
        </div>
    </div>

    <!-- 3. Online Currency Converter -->
    <div id="currency" class="section">
        <div class="input-group">
            <label>Raqam Likhein (Amount)</label>
            <input type="number" id="currAmount" value="1" placeholder="Raqam daalein">
        </div>

        <div class="row input-group">
            <div style="flex:1;">
                <label>From (Kis Se)</label>
                <select id="fromCurr">
                    <option value="USD" selected>USD ($)</option>
                    <option value="PKR">PKR (Rs)</option>
                    <option value="SAR">SAR (Riyal)</option>
                    <option value="AED">AED (Dirham)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="GBP">GBP (£)</option>
                    <option value="INR">INR (₹)</option>
                </select>
            </div>

            <button class="swap-btn" onclick="swapCurrencies()" title="Swap">⇄</button>

            <div style="flex:1;">
                <label>To (Kis Mein)</label>
                <select id="toCurr">
                    <option value="PKR" selected>PKR (Rs)</option>
                    <option value="USD">USD ($)</option>
                    <option value="SAR">SAR (Riyal)</option>
                    <option value="AED">AED (Dirham)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="GBP">GBP (£)</option>
                    <option value="INR">INR (₹)</option>
                </select>
            </div>
        </div>

        <button class="action-btn" onclick="convertCurrency()">Convert Karein</button>

        <div class="result-box" id="currResult" style="display:none;">
            <div class="currency-big" id="convertedText">0.00</div>
            <div class="rate-status" id="rateInfo">Rate load ho raha hai...</div>
        </div>
    </div>
</div>

<script>
    // Tab Switching
    function switchTab(tabId, btn) {
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    // 1. Simple Calculator Logic
    const display = document.getElementById('display');
    function appendValue(val) { display.value += val; }
    function clearDisplay() { display.value = ''; }
    function deleteLast() { display.value = display.value.slice(0, -1); }
    function calculate() {
        try {
            let expression = display.value.replace(/%/g, '/100');
            display.value = eval(expression);
        } catch (error) {
            display.value = 'Error';
        }
    }

    // 2. Loan Calculator Logic
    function calculateLoan() {
        const P = parseFloat(document.getElementById('loanAmount').value);
        const annualRate = parseFloat(document.getElementById('interestRate').value);
        let term = parseFloat(document.getElementById('loanTerm').value);
        const termType = document.getElementById('termType').value;

        if (!P || !term || P <= 0 || term <= 0) {
            alert("Sahi raqam aur muddat likhein!");
            return;
        }

        const months = (termType === 'years') ? term * 12 : term;
        const r = (annualRate || 0) / 12 / 100;

        let emi = (r === 0) ? (P / months) : (P * r * Math.pow(1 + r, months)) / (Math.pow(1 + r, months) - 1);
        const totalPay = emi * months;
        const totalInt = totalPay - P;

        document.getElementById('emiVal').innerText = Math.round(emi).toLocaleString();
        document.getElementById('totalInterest').innerText = Math.round(totalInt).toLocaleString();
        document.getElementById('totalPayment').innerText = Math.round(totalPay).toLocaleString();
        document.getElementById('loanResult').style.display = 'block';
    }

    // 3. Currency Converter Logic (Online Live API + Offline Fallback)
    function swapCurrencies() {
        const from = document.getElementById('fromCurr');
        const to = document.getElementById('toCurr');
        const temp = from.value;
        from.value = to.value;
        to.value = temp;
        convertCurrency();
    }

    async function convertCurrency() {
        const amount = parseFloat(document.getElementById('currAmount').value);
        const from = document.getElementById('fromCurr').value;
        const to = document.getElementById('toCurr').value;
        const resBox = document.getElementById('currResult');
        const resText = document.getElementById('convertedText');
        const rateInfo = document.getElementById('rateInfo');

        if (!amount || amount <= 0) {
            alert("Meharbani karke sahi raqam likhein!");
            return;
        }

        resBox.style.display = 'block';
        resText.innerText = "Calculating...";
        rateInfo.innerText = "Online rate check ho raha hai...";

        try {
            // Free Live Exchange Rate API
            const response = await fetch(`https://open.er-api.com/v6/latest/${from}`);
            const data = await response.json();

            if (data && data.rates && data.rates[to]) {
                const rate = data.rates[to];
                const finalAmount = (amount * rate).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                resText.innerText = `${finalAmount} ${to}`;
                rateInfo.innerText = `Live Rate: 1 ${from} = ${rate.toFixed(2)} ${to}`;
            } else {
                throw new Error("Rate not found");
            }
        } catch (error) {
            // Offline Backup Rates (agar internet band ho)
            const fallbackUSD = { USD: 1, PKR: 278.5, SAR: 3.75, AED: 3.67, EUR: 0.92, GBP: 0.79, INR: 84.0 };
            const inUSD = amount / fallbackUSD[from];
            const finalAmount = (inUSD * fallbackUSD[to]).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const rate = fallbackUSD[to] / fallbackUSD[from];

            resText.innerText = `${finalAmount} ${to}`;
            rateInfo.innerText = `Offline Rate: 1 ${from} = ${rate.toFixed(2)} ${to}`;
        }
    }
</script>

</body>
</html>
